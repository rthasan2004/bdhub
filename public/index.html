<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BD LATEST HUB</title>
<style id="css">
:root{--bg:#0f1030;--card:#181a45;--tx:#f3f1ff;--mu:#a9acd9;--ac:#7c3aed;--ac2:#2563eb;--bd:#34387a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f4ff;--card:#fff;--tx:#1d1a33;--mu:#6a6590;--bd:#d9d3f0;color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Bengali",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0}
.social{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.social a{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:14px}
.slot{margin:10px 0;text-align:center;overflow:hidden;max-width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;margin:14px 0}
.th{aspect-ratio:16/10;background:linear-gradient(135deg,#4c1d95,#2563eb);background-size:cover;background-position:center;display:grid;place-items:center;cursor:pointer}
.pl{width:64px;height:64px;border:4px solid #fff;border-radius:50%;display:grid;place-items:center;background:#0006}
.pl:after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px}
.row b{font-size:17px}
button,.btn{font:inherit;border:0;border-radius:24px;padding:11px 20px;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:var(--bd);color:var(--tx)}button:disabled{opacity:.5}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.task{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:14px;margin:8px 0}
.task.ok{border-color:#2fbf71}
video,iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
input,textarea{width:100%;padding:9px;margin:4px 0;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:60px}
.adm{border:1px dashed var(--ac);border-radius:16px;padding:12px;margin:12px 0}
.adm h3{margin:12px 0 4px}.vrow{border:1px solid var(--bd);border-radius:12px;padding:8px;margin:8px 0}
.mu{color:var(--mu);font-size:13px}
</style></head>
<body><div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<script id="data" type="application/json">{"site":"BD LATEST HUB","perPage":10,"social":[{"n":"Telegram","u":"#"},{"n":"WhatsApp","u":"#"}],"tasks":[{"label":"টাস্ক ১","url":""},{"label":"টাস্ক ২","url":""},{"label":"টাস্ক ৩","url":""}],"ads":{"social":"","top":"","native":"","bottom":"","popunder":""},"videos":[{"id":"v1","title":"","thumb":"","url":""},{"id":"v2","title":"","thumb":"","url":""},{"id":"v3","title":"","thumb":"","url":""}]}</script>
<script id="code">
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var app=document.getElementById('app'),modal=document.getElementById('modal'),box=document.getElementById('box');
var isAdmin=false,adminOpen=false,popDone=false,page=0;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function inject(node,html){if(!html)return;node.innerHTML=html;node.querySelectorAll('script').forEach(function(o){var n=document.createElement('script');for(var i=0;i<o.attributes.length;i++)n.setAttribute(o.attributes[i].name,o.attributes[i].value);n.text=o.text;o.replaceWith(n)})}
function slot(name){var s=el('div','slot');inject(s,D.ads[name]);return s}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function unlocked(id){return store('unl_'+id)==='1'}
function render(){
 app.textContent='';document.title=D.site;
 app.appendChild(el('h1','',D.site));
 var sb=el('div','social');D.social.forEach(function(s){if(!s.n)return;var a=el('a','',s.n);a.href=s.u||'#';a.target='_blank';a.rel='noopener';sb.appendChild(a)});app.appendChild(sb);
 var ss=el('div','slot');inject(ss,D.ads.social);app.appendChild(ss);
 app.appendChild(slot('top'));
 var pp=D.perPage||10,pages=Math.max(1,Math.ceil(D.videos.length/pp));if(page>=pages)page=pages-1;
 D.videos.slice(page*pp,page*pp+pp).forEach(function(v,i){
  var c=el('div','card'),t=el('div','th');if(v.thumb)t.style.backgroundImage='url("'+v.thumb.replace(/"/g,'')+'")';
  t.appendChild(el('div','pl'));t.onclick=function(){openVideo(v)};c.appendChild(t);
  var r=el('div','row');r.appendChild(el('b','',v.title||'\u00a0'));
  var b=el('button','',unlocked(v.id)?'▶ দেখুন':'🔒 আনলক');b.onclick=function(){openVideo(v)};r.appendChild(b);c.appendChild(r);app.appendChild(c);
  if((i+1)%2===0)app.appendChild(slot('native'));
 });
 if(pages>1){var pg=el('div','slot');var pv=el('button','g','← আগের');pv.disabled=page===0;pv.onclick=function(){page--;render();scrollTo(0,0)};var nx=el('button','g','পরের →');nx.disabled=page>=pages-1;nx.onclick=function(){page++;render();scrollTo(0,0)};pg.appendChild(pv);pg.appendChild(el('span','mu',' '+(page+1)+' / '+pages+' '));pg.appendChild(nx);app.appendChild(pg)}
 app.appendChild(slot('bottom'));
 if(isAdmin){var ab=el('button','g','⚙ অ্যাডমিন প্যানেল');ab.onclick=function(){adminOpen=!adminOpen;render()};app.appendChild(ab);if(adminOpen)app.appendChild(adminUI())}
}
function pop(){if(popDone||!D.ads.popunder)return;popDone=true;var h=el('div');h.style.display='none';document.body.appendChild(h);inject(h,D.ads.popunder)}
document.addEventListener('click',pop,{once:true});
function close(){modal.classList.remove('on');box.textContent=''}
modal.onclick=function(e){if(e.target===modal)close()};
function play(v){
 box.textContent='';box.appendChild(el('h3','',v.title));
 var u=v.url||'';
 if(!u){box.appendChild(el('p','mu','ভিডিও লিংক এখনো দেওয়া হয়নি।'))}
 else if(/\.(mp4|webm|m3u8)(\?|$)/i.test(u)){var m=el('video');m.src=u;m.controls=true;m.playsInline=true;box.appendChild(m)}
 else{var f=el('iframe');f.src=u;f.allowFullscreen=true;box.appendChild(f)}
 var x=el('button','g','বন্ধ করুন');x.onclick=close;box.appendChild(x);
}
function openVideo(v){
 modal.classList.add('on');
 if(unlocked(v.id)){play(v);return}
 box.textContent='';box.appendChild(el('h3','','🔒 '+v.title));
 box.appendChild(el('p','mu','ভিডিও আনলক করতে নিচের ৩টি টাস্ক সম্পন্ন করুন।'));
 var done=[false,false,false],go=el('button','','▶ ভিডিও দেখুন');go.disabled=true;
 D.tasks.forEach(function(t,i){
  var r=el('div','task');r.appendChild(el('span','',t.label||('টাস্ক '+(i+1))));
  var b=el('button','','শুরু করুন');
  b.onclick=function(){
   if(t.url)window.open(t.url,'_blank','noopener');
   b.disabled=true;var n=5;b.textContent=n+'s';
   var iv=setInterval(function(){n--;if(n>0){b.textContent=n+'s';return}clearInterval(iv);done[i]=true;b.textContent='✔ সম্পন্ন';r.classList.add('ok');if(done.every(Boolean))go.disabled=false},1000);
  };
  r.appendChild(b);box.appendChild(r);
 });
 go.onclick=function(){store('unl_'+v.id,'1');play(v);render()};
 box.appendChild(go);box.appendChild(document.createTextNode(' '));
 var x=el('button','g','বন্ধ');x.onclick=close;box.appendChild(x);
}
render();
fetch('/api/data',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(d&&d.videos){D=d;render()}}).catch(function(){});
})();
</script></body></html>
