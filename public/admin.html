<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title><style>
:root{--bg:#0f1030;--card:#181a45;--tx:#f3f1ff;--mu:#a9acd9;--ac:#7c3aed;--ac2:#2563eb;--bd:#34387a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f4ff;--card:#fff;--tx:#1d1a33;--mu:#6a6590;--bd:#d9d3f0;color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Bengali",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0}
.social{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.social a{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:14px}
.slot{margin:10px 0;text-align:center;overflow:hidden;max-width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;margin:14px 0}
.th{aspect-ratio:16/10;background:linear-gradient(135deg,#4c1d95,#2563eb);background-size:cover;background-position:center;display:grid;place-items:center;cursor:pointer}
.pl{width:64px;height:64px;border:4px solid #fff;border-radius:50%;display:grid;place-items:center;background:#0006}
.pl:after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px}
.row b{font-size:17px}
button,.btn{font:inherit;border:0;border-radius:24px;padding:11px 20px;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:var(--bd);color:var(--tx)}button:disabled{opacity:.5}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.task{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:14px;margin:8px 0}
.task.ok{border-color:#2fbf71}
video,iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
input,textarea{width:100%;padding:9px;margin:4px 0;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:60px}
.adm{border:1px dashed var(--ac);border-radius:16px;padding:12px;margin:12px 0}
.adm h3{margin:12px 0 4px}.vrow{border:1px solid var(--bd);border-radius:12px;padding:8px;margin:8px 0}
.mu{color:var(--mu);font-size:13px}
</style></head><body><div class="wrap" id="app"></div>
<script id="data" type="application/json">{"site":"BD LATEST HUB","perPage":10,"social":[{"n":"Telegram","u":"#"},{"n":"WhatsApp","u":"#"}],"tasks":[{"label":"টাস্ক ১","url":""},{"label":"টাস্ক ২","url":""},{"label":"টাস্ক ৩","url":""}],"ads":{"social":"","top":"","native":"","bottom":"","popunder":""},"videos":[{"id":"v1","title":"","thumb":"","url":""},{"id":"v2","title":"","thumb":"","url":""},{"id":"v3","title":"","thumb":"","url":""}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent),app=document.getElementById('app'),PW=sessionStorage.getItem('pw')||'';
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function field(parent,label,val,cb,multi){parent.appendChild(el('div','mu',label));var i=el(multi?'textarea':'input');i.value=val||'';i.oninput=function(){cb(i.value)};parent.appendChild(i);return i}
function api(m,body,h){h=h||{};h['x-admin']=PW;if(!(body instanceof ArrayBuffer))h['content-type']='application/json';return fetch('/api/data',{method:m,headers:h,body:body})}
function login(){
 app.textContent='';app.appendChild(el('h1','','অ্যাডমিন লগইন'));
 var i=el('input');i.type='password';i.placeholder='পাসওয়ার্ড';var m=el('div','mu','');
 var b=el('button','','লগইন');b.onclick=async function(){PW=i.value;var r=await api('POST','{}');if(r.ok){sessionStorage.setItem('pw',PW);load()}else m.textContent='ভুল পাসওয়ার্ড'};
 app.appendChild(i);app.appendChild(b);app.appendChild(m)}
async function load(){try{var r=await fetch('/api/data',{cache:'no-store'});var d=await r.json();if(d&&d.videos)D=d}catch(e){}ui()}
async function up(file,cb,msg){
 msg.textContent=' আপলোড হচ্ছে...';
 try{var ext=(file.name.split('.').pop()||'bin').toLowerCase();var buf=await file.arrayBuffer();
  var r=await fetch('/api/upload',{method:'POST',headers:{'x-admin':PW,'x-ext':ext,'content-type':file.type||'application/octet-stream'},body:buf});
  if(!r.ok)throw 0;var j=await r.json();cb(j.url);msg.textContent=' ✔ হয়েছে';ui()}catch(e){msg.textContent=' ব্যর্থ (৪ এমবির নিচের ছবি দিন)'}}
function filebtn(parent,label,accept,cb){var w=el('div');var f=el('input');f.type='file';f.accept=accept;var m=el('span','mu','');f.onchange=function(){if(f.files[0])up(f.files[0],cb,m)};w.appendChild(el('span','mu',label));w.appendChild(f);w.appendChild(m);parent.appendChild(w)}
function ui(){
 app.textContent='';var p=el('div');p.appendChild(el('h1','','⚙ অ্যাডমিন প্যানেল'));
 p.appendChild(el('h3','','সাইট'));field(p,'সাইটের নাম',D.site,function(v){D.site=v});
 field(p,'প্রতি পেজে ভিডিও',String(D.perPage||10),function(v){D.perPage=Math.max(1,parseInt(v)||10)});
 p.appendChild(el('h3','','সোশ্যাল বার (Telegram / WhatsApp)'));
 D.social.forEach(function(s){field(p,'নাম',s.n,function(v){s.n=v});field(p,'লিংক',s.u,function(v){s.u=v})});
 p.appendChild(el('h3','','আনলক টাস্ক (অ্যাড লিংক)'));
 D.tasks.forEach(function(t,i){field(p,'টাস্ক '+(i+1)+' নাম',t.label,function(v){t.label=v});field(p,'টাস্ক '+(i+1)+' অ্যাড লিংক',t.url,function(v){t.url=v})});
 p.appendChild(el('h3','','অ্যাড কোড (HTML/স্ক্রিপ্ট)'));
 [['social','সোশ্যাল বার'],['top','ব্যানার (উপরে)'],['native','নেটিভ ব্যানার'],['bottom','ব্যানার (নিচে)'],['popunder','পপআন্ডার']].forEach(function(a){field(p,a[1],D.ads[a[0]],function(v){D.ads[a[0]]=v},true)});
 p.appendChild(el('h3','','ভিডিও ('+D.videos.length+')'));
 var av=el('button','g','+ নতুন ভিডিও (উপরে যোগ হবে)');av.onclick=function(){D.videos.unshift({id:'v'+Date.now(),title:'',thumb:'',url:''});ui()};p.appendChild(av);
 D.videos.forEach(function(v,i){var r=el('div','vrow');
  field(r,'টাইটেল',v.title,function(x){v.title=x});
  var ti=field(r,'থাম্বনেইল লিংক',v.thumb,function(x){v.thumb=x});filebtn(r,'অথবা ছবি আপলোড: ','image/*',function(u){v.thumb=u});
  field(r,'ভিডিও লিংক (mp4 বা embed)',v.url,function(x){v.url=x});
  var d=el('button','g','মুছুন');d.onclick=function(){if(confirm('মুছবেন?')){D.videos.splice(i,1);ui()}};r.appendChild(d);
  if(i>0){var u=el('button','g','↑');u.onclick=function(){D.videos.splice(i-1,2,v,D.videos[i-1]);ui()};r.appendChild(document.createTextNode(' '));r.appendChild(u)}
  p.appendChild(r)});
 var sv=el('button','','💾 সেভ করুন');var m=el('span','mu','');
 sv.onclick=async function(){m.textContent=' সেভ হচ্ছে...';var r=await api('PUT',JSON.stringify(D));m.textContent=r.ok?' ✔ সেভ হয়েছে':' ব্যর্থ'};
 p.appendChild(el('p'));p.appendChild(sv);p.appendChild(m);
 var lo=el('button','g','লগআউট');lo.onclick=function(){sessionStorage.removeItem('pw');login()};p.appendChild(document.createTextNode(' '));p.appendChild(lo);
 app.appendChild(p)}
if(PW)api('POST','{}').then(function(r){r.ok?load():login()});else login();
})();
</script></body></html>
